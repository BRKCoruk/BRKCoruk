<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="840" height="390">
  <defs>
    <style>
      .term-bg { fill: #0a0e14; stroke: #30363d; stroke-width: 1.5; }
      .title-bar { fill: #161b22; }
      .title-text { fill: #8b949e; font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13px; }
      .ascii { fill: #cbd5e1; font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13.5px; white-space: pre; }
      .hud-accent { fill: #10b981; }
      .prompt-user { fill: #10b981; font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 14.5px; font-weight: bold; }
      .prompt-path { fill: #38bdf8; font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 14.5px; font-weight: bold; }
      .cmd-text { fill: #f8fafc; font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 14.5px; }

      .line1 { animation: type1 12s steps(32, end) infinite; }
      .line2 { animation: type2 12s steps(44, end) infinite; }
      .line3 { animation: type3 12s steps(46, end) infinite; }
      .cursor { fill: #10b981; animation: blink 0.9s step-end infinite; }

      @keyframes type1 {
        0%, 2% { width: 0px; }
        14%, 28% { width: 310px; }
        32%, 100% { width: 0px; }
      }
      @keyframes type2 {
        0%, 34% { width: 0px; }
        48%, 62% { width: 420px; }
        66%, 100% { width: 0px; }
      }
      @keyframes type3 {
        0%, 68% { width: 0px; }
        82%, 95% { width: 440px; }
        99%, 100% { width: 0px; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  
