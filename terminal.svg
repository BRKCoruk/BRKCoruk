<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="840" height="390">
  <defs>
    <style>
      .term-bg { fill: #0a0e14; stroke: #30363d; stroke-width: 1.5; }
      .title-bar { fill: #161b22; }
      .title-text { fill: #8b949e; font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13px; }
      .ascii { fill: #cbd5e1; font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13.5px; white-space: pre; font-variant-ligatures: none; }
      .hud-accent { fill: #10b981; }
      .prompt-user { fill: #10b981; font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 14.5px; font-weight: bold; }
      .prompt-path { fill: #38bdf8; font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 14.5px; font-weight: bold; }
      .cmd-text { fill: #f8fafc; font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 14.5px; font-variant-ligatures: none; }

      .cmd1 { opacity: 0; visibility: hidden; animation: show1 12s infinite; }
      .cmd2 { opacity: 0; visibility: hidden; animation: show2 12s infinite; }
      .cmd3 { opacity: 0; visibility: hidden; animation: show3 12s infinite; }
      .cover { animation: slideCover 12s infinite; }
      .cursor { fill: #10b981; animation: blink 0.8s step-end infinite; }

      @keyframes show1 {
        0%, 32.9% { opacity: 1; visibility: visible; }
        33%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes show2 {
        0%, 32.9% { opacity: 0; visibility: hidden; }
        33%, 65.9% { opacity: 1; visibility: visible; }
        66%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes show3 {
        0%, 65.9% { opacity: 0; visibility: hidden; }
        66%, 99.9% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }

      @keyframes slideCover {
        0%, 2% { transform: translateX(192px); }
        15%, 30% { transform: translateX(415px); }
        33%, 35% { transform: translateX(192px); }
        48%, 63% { transform: translateX(555px); }
        66%, 68% { transform: translateX(192px); }
        81%, 96% { transform: translateX(545px); }
        100% { transform: translateX(192px); }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  
